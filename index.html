<title>Cyberpunk Anime Live Wallpaper</title>
<style>
  :root{
    --cyan:#00f0ff;
    --pink:#ff007f;
    --bg-base:#05050a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    overflow:hidden;
    background:var(--bg-base);
    font-family:'Consolas','Courier New',monospace;
    cursor:default;
    perspective:1200px; /* lets #stage itself tilt in true 3D for a deeper parallax */
  }

  /* ===== LAYER STAGE ===== */
  #stage{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    perspective:1200px;
    overflow:hidden;
    background:var(--bg-base);
  }

  .layer{
    position:absolute;
    top:-16%;
    left:-16%;
    width:132%;
    height:132%;
    background-position:center center;
    background-size:cover;
    background-repeat:no-repeat;
    will-change:transform;
    transform-style:preserve-3d;
    pointer-events:none;
    transition:filter .25s ease;
  }

  #layer5{ background-image:url('char1.png'); background-size:46% auto; background-position:18% 94%; background-repeat:no-repeat; z-index:5; } /* your character 1 */
  #layer6{ background-image:url('char2.png'); background-size:52% auto; background-position:54% 97%; background-repeat:no-repeat; z-index:6; } /* your character 2 */
  #layer7{ background-image:url('char3.png'); background-size:58% auto; background-position:84% 100%; background-repeat:no-repeat; z-index:7; pointer-events:auto; } /* your character 3 - closest */

  #layer7.glow-on{
    filter:drop-shadow(0 0 25px var(--cyan)) drop-shadow(0 0 45px var(--pink));
  }

  /* ===== CANVAS OVERLAYS ===== */
  #smokeCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:4; pointer-events:none;
    mix-blend-mode:screen;
    opacity:0.85;
  }
  #particleCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    z-index:10; pointer-events:none;
  }
  #waveCanvas{
    position:fixed; bottom:0; left:0; width:100%; height:220px;
    z-index:11; pointer-events:none;
  }

  /* ===== SYMBOL BAR ===== */
  #symbolBar{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:18px;
    padding:10px 24px;
    border-radius:30px;
    background:rgba(10,10,20,0.35);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(0,240,255,0.25);
    box-shadow:0 0 20px rgba(0,240,255,0.15), inset 0 0 12px rgba(255,0,127,0.08);
    z-index:20;
    pointer-events:none;
  }
  #symbolBar span{
    color:var(--cyan);
    font-size:15px;
    text-shadow:0 0 8px var(--cyan);
    opacity:0.85;
  }

  /* ===== FAB MENU ===== */
  #fabContainer{
    position:fixed;
    top:40px;
    left:40px;
    z-index:50;
    user-select:none;
  }
  #fabMain{
    width:58px;height:58px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #1a1a2e, #05050a);
    border:2px solid var(--cyan);
    box-shadow:0 0 15px var(--cyan), 0 0 30px rgba(255,0,127,0.4);
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    color:var(--cyan);
    cursor:grab;
    transition:transform .2s ease, box-shadow .3s ease;
    touch-action:none;
  }
  #fabMain:active{cursor:grabbing;transform:scale(0.92);}
  #fabMain.spin{animation:spin 6s linear infinite;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  #controlPanel{
    position:absolute;
    top:70px;
    left:0;
    width:230px;
    padding:16px;
    border-radius:16px;
    background:rgba(12,12,24,0.55);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(0,240,255,0.3);
    box-shadow:0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(255,0,127,0.15);
    opacity:0;
    transform:translateY(-14px) scale(0.92);
    pointer-events:none;
    transition:all .38s cubic-bezier(0.34,1.56,0.64,1);
  }
  #controlPanel.open{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  /* when the FAB is dragged near an edge, flip the panel so it never runs off-screen */
  #controlPanel.flip-up{ top:auto; bottom:70px; }
  #controlPanel.flip-left{ left:auto; right:0; }
  .ctrl-title{
    color:var(--pink);
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:10px;
    text-shadow:0 0 6px var(--pink);
  }
  .ctrl-btn{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 12px;
    margin-bottom:8px;
    border-radius:8px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(0,240,255,0.15);
    color:#cdefff;
    font-size:12.5px;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease;
  }
  .ctrl-btn:hover{background:rgba(0,240,255,0.08);}
  .state-dot{
    width:10px;height:10px;border-radius:50%;
    background:#444;
    box-shadow:none;
    transition:all .25s ease;
  }
  .state-dot.on{
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan), 0 0 14px var(--pink);
  }
  .ultra-btn{
    margin-top:4px;
    text-align:center;
    font-weight:bold;
    letter-spacing:1px;
    color:#05050a;
    background:linear-gradient(90deg,var(--cyan),var(--pink));
    border:none;
    justify-content:center;
  }
  .ultra-btn:hover{filter:brightness(1.15);}

  /* ===== SMOKE SETTINGS PANEL ===== */
  #smokePanel, #parallaxPanel, #posPanel{
    position:absolute;
    top:70px;
    left:0;
    width:230px;
    max-width:calc(100vw - 60px);
    max-height:60vh;
    overflow-y:auto;
    padding:16px;
    border-radius:16px;
    background:rgba(12,12,24,0.6);
    backdrop-filter:blur(18px) saturate(180%);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    border:1px solid rgba(255,0,127,0.35);
    box-shadow:0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(0,240,255,0.15);
    opacity:0;
    transform:translateY(-14px) scale(0.92);
    pointer-events:none;
    transition:all .38s cubic-bezier(0.34,1.56,0.64,1);
  }
  /* horizontal/vertical anchor is now computed in JS (positionSmokePanel/positionParallaxPanel) so it always
     stacks BELOW the main panel instead of beside it - keeps it on-screen on narrow phones */
  #smokePanel.flip-left, #parallaxPanel.flip-left, #posPanel.flip-left{ left:auto; right:0; }
  #smokePanel.open, #parallaxPanel.open, #posPanel.open{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .parallax-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
  }
  .parallax-row input[type="number"]{
    width:70px;
    background:rgba(0,240,255,0.08);
    border:1px solid rgba(0,240,255,0.35);
    border-radius:8px;
    color:var(--cyan);
    font-family:inherit;
    font-size:12px;
    padding:4px 6px;
  }
  #posPanel .parallax-row{ margin-bottom:14px; }
  #posPanel .parallax-row input[type="number"]{ width:52px; }
  #posPanel .smoke-hint{ font-size:10px; }
  .smoke-label{
    display:block;
    color:var(--cyan);
    font-size:10.5px;
    letter-spacing:1px;
    margin:10px 0 4px;
    text-transform:uppercase;
    opacity:0.85;
  }
  .smoke-select{
    width:100%;
    padding:7px 8px;
    border-radius:8px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(0,240,255,0.2);
    color:#e8faff;
    font-size:12px;
    font-family:inherit;
  }
  .smoke-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .smoke-hint{
    font-size:11px;
    color:#9fd8e8;
    opacity:0.8;
  }
  .color-list{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .color-chip{
    position:relative;
    width:26px;
    height:26px;
  }
  .color-chip input[type="color"]{
    width:26px;
    height:26px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:6px;
    background:none;
    padding:0;
    cursor:pointer;
  }
  .chip-remove{
    position:absolute;
    top:-6px;
    right:-6px;
    width:14px;
    height:14px;
    line-height:14px;
    text-align:center;
    font-size:10px;
    border-radius:50%;
    background:var(--pink);
    color:#05050a;
    cursor:pointer;
  }
  .small-btn{
    padding:6px 10px;
    border-radius:8px;
    border:1px solid rgba(0,240,255,0.3);
    background:rgba(0,240,255,0.08);
    color:var(--cyan);
    font-size:11px;
    font-family:inherit;
    cursor:pointer;
  }
  .small-btn:hover{background:rgba(0,240,255,0.16);}
</style>
</head>
<body>

<div id="stage">
  <div class="layer" id="layer1"></div>
  <div class="layer" id="layer2"></div>
  <div class="layer" id="layer3"></div>
  <div class="layer" id="layer4"></div>
  <canvas id="smokeCanvas"></canvas>
  <div class="layer" id="layer5"></div>
  <div class="layer" id="layer6"></div>
  <div class="layer" id="layer7"></div>
</div>

<canvas id="particleCanvas"></canvas>
<canvas id="waveCanvas"></canvas>

<div id="symbolBar">
  <span>&lt;/&gt;</span><span>{ }</span><span>( )</span><span>[ ]</span><span>;</span><span>=</span><span>#</span>
</div>

<div id="fabContainer">
  <div id="fabMain">⚡</div>
  <div id="controlPanel">
    <div class="ctrl-title">// EFFECT CONTROL</div>
    <div class="ctrl-btn" data-fx="parallax">Parallax <div class="state-dot"></div></div>
    <div class="ctrl-btn" id="parallaxSettingsBtn">Parallax Settings &#9881;</div>
    <div class="ctrl-btn" data-fx="tilt">3D Tilt <div class="state-dot"></div></div>
    <div class="ctrl-btn" data-fx="glow">Glow Hover <div class="state-dot"></div></div>
    <div class="ctrl-btn" data-fx="particles">Particle Trail <div class="state-dot"></div></div>
    <div class="ctrl-btn" data-fx="wave">Neon Wave <div class="state-dot"></div></div>
    <div class="ctrl-btn" data-fx="smoke">Color Smoke <div class="state-dot"></div></div>
    <div class="ctrl-btn" id="smokeSettingsBtn">Smoke Settings &#9881;</div>
    <div class="ctrl-btn" id="charPosBtn">Character Position &#9881;</div>
    <div class="ctrl-btn ultra-btn" id="ultraBtn">ULTRA MIX ALL</div>
  </div>

  <div id="smokePanel">
    <div class="ctrl-title">// SMOKE CUSTOMIZE</div>

    <label class="smoke-label">Position (behind layer)</label>
    <select id="smokeLayerSelect" class="smoke-select">
      <option value="1">Layer 1 (farthest)</option>
      <option value="2">Layer 2</option>
      <option value="3">Layer 3</option>
      <option value="4">Layer 4</option>
      <option value="5">Layer 5 (char 1)</option>
      <option value="6">Layer 6 (char 2)</option>
      <option value="7" selected>Layer 7 (char 3, foreground)</option>
    </select>

    <label class="smoke-label">Comes From</label>
    <select id="smokeFromSelect" class="smoke-select">
      <option value="left">Left</option>
      <option value="right">Right</option>
      <option value="top">Top</option>
      <option value="bottom" selected>Bottom</option>
      <option value="random">Random</option>
    </select>

    <label class="smoke-label">Moves To</label>
    <select id="smokeToSelect" class="smoke-select">
      <option value="left">Left</option>
      <option value="right">Right</option>
      <option value="top" selected>Top</option>
      <option value="bottom">Bottom</option>
      <option value="random">Random</option>
    </select>

    <label class="smoke-label">Color Mode</label>
    <select id="smokeColorMode" class="smoke-select">
      <option value="single">Single Color</option>
      <option value="multi" selected>Multi (slow fade)</option>
      <option value="random">Random</option>
    </select>

    <div id="singleColorRow" class="smoke-row" style="display:none;">
      <input type="color" id="smokeColorSingle" value="#00f0ff">
      <span class="smoke-hint">Pick a color</span>
    </div>

    <div id="multiColorRow" class="smoke-row">
      <div id="colorList" class="color-list"></div>
      <button id="addColorBtn" class="small-btn" type="button">+ Color</button>
    </div>

    <div class="ctrl-btn" id="mouseInteractBtn">Mouse Displace <div class="state-dot on" id="mouseInteractDot"></div></div>
  </div>

  <div id="parallaxPanel">
    <div class="ctrl-title">// PARALLAX STRENGTH</div>
    <div class="parallax-row">
      <label class="smoke-label" style="margin:0;">Layer 1 (farthest)</label>
      <input type="number" id="parallaxSpeed1" step="0.005" min="0" max="1">
    </div>
    <div class="parallax-row">
      <label class="smoke-label" style="margin:0;">Layer 2</label>
      <input type="number" id="parallaxSpeed2" step="0.005" min="0" max="1">
    </div>
    <div class="parallax-row">
      <label class="smoke-label" style="margin:0;">Layer 3</label>
      <input type="number" id="parallaxSpeed3" step="0.005" min="0" max="1">
    </div>
    <div class="parallax-row">
      <label class="smoke-label" style="margin:0;">Layer 4</label>
      <input type="number" id="parallaxSpeed4" step="0.005" min="0" max="1">
    </div>
    <div class="parallax-row">
      <label class="smoke-label" style="margin:0;">Layer 5 (char 1)</label>
      <input type="number" id="parallaxSpeed5" step="0.005" min="0" max="1">
    </div>
    <div class="parallax-row">
      <label class="smoke-label" style="margin:0;">Layer 6 (char 2)</label>
      <input type="number" id="parallaxSpeed6" step="0.005" min="0" max="1">
    </div>
    <div class="parallax-row">
      <label class="smoke-label" style="margin:0;">Layer 7 (char 3, foreground)</label>
      <input type="number" id="parallaxSpeed7" step="0.005" min="0" max="1">
    </div>
  </div>

  <div id="posPanel">
    <div class="ctrl-title">// CHARACTER POSITION</div>
    <label class="smoke-label">Char 1 (layer 5)</label>
    <div class="parallax-row">
      <span class="smoke-hint">X %</span>
      <input type="number" id="posX5" step="1" min="-20" max="120">
      <span class="smoke-hint">Y %</span>
      <input type="number" id="posY5" step="1" min="-20" max="120">
    </div>
    <label class="smoke-label">Char 2 (layer 6)</label>
    <div class="parallax-row">
      <span class="smoke-hint">X %</span>
      <input type="number" id="posX6" step="1" min="-20" max="120">
      <span class="smoke-hint">Y %</span>
      <input type="number" id="posY6" step="1" min="-20" max="120">
    </div>
    <label class="smoke-label">Char 3 (layer 7)</label>
    <div class="parallax-row">
      <span class="smoke-hint">X %</span>
      <input type="number" id="posX7" step="1" min="-20" max="120">
      <span class="smoke-hint">Y %</span>
      <input type="number" id="posY7" step="1" min="-20" max="120">
    </div>
  </div>
</div>

<script>
/* =========================================================
   STATE
========================================================= */
const fx = {
  parallax:true,
  tilt:true,
  glow:true,
  particles:true,
  wave:true,
  smoke:true
};

const layers = [
  document.getElementById('layer1'),
  document.getElementById('layer2'),
  document.getElementById('layer3'),
  document.getElementById('layer4'),
  document.getElementById('layer5'),
  document.getElementById('layer6'),
  document.getElementById('layer7')
];
const stageEl = document.getElementById('stage');
const STAGE_PERSPECTIVE = 1200;

// Farthest layer moves least & sits deepest, closest (foreground) moves most & sits nearest.
let parallaxSpeeds = [0.012, 0.032, 0.06, 0.10, 0.13, 0.16, 0.20];       // lateral drift per layer (editable via Parallax Settings panel)
const layerDepthZ     = [-340, -230, -140, -60, -30, -10, 0];             // true 3D depth per layer (px)
// Pre-computed scale that cancels out the perspective shrink caused by pushing a layer back in Z,
// so every layer still fully covers the screen no matter how deep it sits.
const layerDepthScale = layerDepthZ.map(z => (STAGE_PERSPECTIVE - z) / STAGE_PERSPECTIVE);
const fgLayer = layers[layers.length - 1]; // treated as the character/foreground

let mouseX = 0, mouseY = 0;
let targetX = 0, targetY = 0;

function updatePointer(clientX, clientY){
  const w = window.innerWidth, h = window.innerHeight;
  targetX = (clientX / w - 0.5) * 2; // -1 to 1
  targetY = (clientY / h - 0.5) * 2;
  mouseX = clientX;
  mouseY = clientY;
}
window.addEventListener('mousemove', (e)=> updatePointer(e.clientX, e.clientY));
// Touch support so the depth/parallax effect also responds while testing on a phone
window.addEventListener('touchmove', (e)=>{
  if(!e.touches || !e.touches.length) return;
  updatePointer(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:true});

/* =========================================================
   ANIMATION LOOP: deep 3D parallax (per-layer Z-depth + drift) + tilt
========================================================= */
let curX = 0, curY = 0;
let breathT = 0; // idle-life clock: gentle breathing + sway so the foreground character never reads as a static cutout
function animateLayers(){
  // smooth easing toward target
  curX += (targetX - curX) * 0.07;
  curY += (targetY - curY) * 0.07;
  breathT += 0.016;
  const breathScale = 1 + Math.sin(breathT * 0.9) * 0.012;   // slow chest-rise/fall
  const swayDeg = Math.sin(breathT * 0.55) * 1.4;            // slow romantic sway

  layers.forEach((layer, i)=>{
    let tx = 0, ty = 0, rot = '';
    if(fx.parallax){
      const speed = parallaxSpeeds[i] * 130;
      tx = -curX * speed;
      ty = -curY * speed;
    }
    if(fx.tilt && layer === fgLayer){
      const rotY = curX * 11;
      const rotX = -curY * 11;
      rot = ` rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }
    if(layer === fgLayer){
      rot += ` rotateZ(${swayDeg}deg)`; // idle sway even when tilt/parallax are both off
    }
    const z = fx.parallax ? layerDepthZ[i] : 0;
    let scale = fx.parallax ? layerDepthScale[i] : 1;
    if(layer === fgLayer) scale *= breathScale;
    layer.style.transform = `translate3d(${tx}px, ${ty}px, ${z}px) scale(${scale})${rot}`;
  });

  // Tilt the whole stage a touch too - with each layer already sitting at a different
  // Z depth, this shared rotation is what makes the scene read as genuinely deep/3D
  // instead of just flat images sliding past each other.
  if(fx.parallax){
    const stageRotY = curX * 4;
    const stageRotX = -curY * 4;
    stageEl.style.transform = `rotateX(${stageRotX}deg) rotateY(${stageRotY}deg)`;
  } else {
    stageEl.style.transform = 'none';
  }

  requestAnimationFrame(animateLayers);
}
animateLayers();

/* Glow hover on foreground */
fgLayer.addEventListener('mouseenter', ()=>{ if(fx.glow) fgLayer.classList.add('glow-on'); });
fgLayer.addEventListener('mouseleave', ()=>{ fgLayer.classList.remove('glow-on'); });

/* =========================================================
   PARTICLE TRAIL ENGINE
========================================================= */
const pCanvas = document.getElementById('particleCanvas');
const pCtx = pCanvas.getContext('2d');
let particles = [];

function resizeCanvases(){
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
  wCanvas.width = window.innerWidth;
  wCanvas.height = 220;
  sCanvas.width = window.innerWidth;
  sCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvases);

window.addEventListener('mousemove', (e)=>{
  if(!fx.particles) return;
  for(let i=0;i<2;i++){
    particles.push({
      x:e.clientX, y:e.clientY,
      vx:(Math.random()-0.5)*1.2,
      vy:(Math.random()-0.5)*1.2,
      life:1,
      size:Math.random()*2.5+1.5,
      color: Math.random()>0.5 ? '0,240,255' : '255,0,127'
    });
  }
  if(particles.length > 220) particles.splice(0, particles.length-220);
});

function drawParticles(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  if(fx.particles){
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      pCtx.fillStyle = `rgba(${p.color},${Math.max(p.life,0)})`;
      pCtx.shadowBlur = 12;
      pCtx.shadowColor = `rgba(${p.color},1)`;
      pCtx.fill();
    });
    particles = particles.filter(p=>p.life > 0);
  }
  requestAnimationFrame(drawParticles);
}
drawParticles();

/* =========================================================
   COLOR SMOKE ENGINE
   Soft drifting neon smoke puffs behind the foreground layer
========================================================= */
const sCanvas = document.getElementById('smokeCanvas');
const sCtx = sCanvas.getContext('2d');
let smokePuffs = [];

/* ---- customizable smoke settings (wired to the Smoke Settings panel) ---- */
const smokeSettings = {
  layer: 7,               // sits just behind this layer number (1-7)
  from: 'bottom',         // left | right | top | bottom | random
  to: 'top',              // left | right | top | bottom | random
  colorMode: 'multi',     // single | multi | random
  singleColor: '#ff6fb0',
  colors: ['#ff6fb0', '#ffd28a', '#ff2f7e'],
  mouseInteract: true
};
let colorCycleT = 0;

function hexToRgb(hex){
  hex = hex.replace('#','').trim();
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16) || 0;
  return [(num>>16)&255, (num>>8)&255, num&255];
}

/* place the smoke canvas just behind the chosen layer, inside #stage's own stacking context */
function setSmokeLayer(layerNum){
  layerNum = Math.max(1, Math.min(7, layerNum));
  smokeSettings.layer = layerNum;
  const target = document.getElementById('layer'+layerNum);
  sCanvas.style.zIndex = layerNum;
  stageEl.insertBefore(sCanvas, target);
}
setSmokeLayer(smokeSettings.layer);

function getCurrentBlendColor(){
  const list = smokeSettings.colors;
  if(list.length === 0) return [0,240,255];
  if(list.length === 1) return hexToRgb(list[0]);
  const seg = colorCycleT % list.length;
  const i0 = Math.floor(seg);
  const i1 = (i0+1) % list.length;
  const t = seg - i0;
  const c0 = hexToRgb(list[i0]), c1 = hexToRgb(list[i1]);
  return [
    c0[0] + (c1[0]-c0[0])*t,
    c0[1] + (c1[1]-c0[1])*t,
    c0[2] + (c1[2]-c0[2])*t
  ];
}

function pickSide(val){
  const sides = ['left','right','top','bottom'];
  return val === 'random' ? sides[Math.floor(Math.random()*4)] : val;
}

/* spawn point + travel vector based on From / To settings */
function computeSmokeSpawn(){
  const w = sCanvas.width, h = sCanvas.height;
  const from = pickSide(smokeSettings.from);
  const to = pickSide(smokeSettings.to);
  let x, y;
  switch(from){
    case 'left':  x = -90; y = Math.random()*h; break;
    case 'right': x = w+90; y = Math.random()*h; break;
    case 'top':   x = Math.random()*w; y = -90; break;
    default:      x = Math.random()*w; y = h+90; break; // bottom
  }
  const speed = 0.3 + Math.random()*0.45;
  let vx = (Math.random()-0.5)*0.15, vy = (Math.random()-0.5)*0.15;
  switch(to){
    case 'left':  vx = -speed; break;
    case 'right': vx = speed;  break;
    case 'top':   vy = -speed; break;
    default:      vy = speed;  break; // bottom
  }
  return {x,y,vx,vy};
}

function spawnSmokePuff(){
  const spawn = computeSmokeSpawn();
  let color = null;
  if(smokeSettings.colorMode === 'single') color = hexToRgb(smokeSettings.singleColor);
  else if(smokeSettings.colorMode === 'random') color = [Math.random()*255, Math.random()*255, Math.random()*255];
  // 'multi' mode reads the live blended color each frame instead (see draw loop)

  smokePuffs.push({
    x: spawn.x, y: spawn.y,
    vx: spawn.vx, vy: spawn.vy,
    r: 90 + Math.random()*140,
    drift: Math.random()*Math.PI*2,
    driftSpeed: 0.004 + Math.random()*0.006,
    life: 1,
    fade: 0.0016 + Math.random()*0.0014,
    fixedColor: color // null means "use live multi-color blend"
  });
}
// size the smoke canvas to the real screen BEFORE seeding puffs,
// otherwise they spawn inside the default 300x150 canvas box and end up
// clustered in a tiny corner instead of spread across the screen.
sCanvas.width = window.innerWidth;
sCanvas.height = window.innerHeight;

// seed initial puffs so it doesn't start empty
for(let i=0;i<14;i++){
  spawnSmokePuff();
  smokePuffs[smokePuffs.length-1].life = 0.5 + Math.random()*0.5;
}

let smokeSpawnTimer = 0;
function drawSmoke(){
  sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
  if(fx.smoke){
    colorCycleT += 0.0015;
    smokeSpawnTimer++;
    if(smokeSpawnTimer > 90 && smokePuffs.length < 26){
      spawnSmokePuff();
      smokeSpawnTimer = 0;
    }

    const liveBlend = getCurrentBlendColor();
    const repelRadius = 150;

    smokePuffs.forEach(p=>{
      p.drift += p.driftSpeed;
      p.x += p.vx + Math.sin(p.drift) * 0.3;
      p.y += p.vy + Math.cos(p.drift) * 0.2;
      p.life -= p.fade;

      /* mouse "parts the smoke like water" displacement */
      if(smokeSettings.mouseInteract){
        const dx = p.x - mouseX, dy = p.y - mouseY;
        const dist = Math.max(Math.sqrt(dx*dx + dy*dy), 0.001);
        if(dist < repelRadius){
          const force = (1 - dist/repelRadius) * 6;
          p.x += (dx/dist) * force;
          p.y += (dy/dist) * force;
        }
      }

      const col = p.fixedColor || liveBlend;
      const alpha = Math.max(p.life, 0) * 0.35;
      const grad = sCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      grad.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${alpha})`);
      grad.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
      sCtx.beginPath();
      sCtx.fillStyle = grad;
      sCtx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      sCtx.fill();
    });

    smokePuffs = smokePuffs.filter(p =>
      p.life > 0 && p.x > -300 && p.x < sCanvas.width+300 && p.y > -300 && p.y < sCanvas.height+300
    );
  }
  requestAnimationFrame(drawSmoke);
}
drawSmoke();

/* ---- Smoke Settings panel wiring ---- */
document.getElementById('smokeSettingsBtn').addEventListener('click', ()=>{
  positionSmokePanel();
  document.getElementById('smokePanel').classList.toggle('open');
});
document.getElementById('smokeLayerSelect').addEventListener('change', e=>{
  setSmokeLayer(parseInt(e.target.value));
});
document.getElementById('smokeFromSelect').addEventListener('change', e=>{
  smokeSettings.from = e.target.value;
});
document.getElementById('smokeToSelect').addEventListener('change', e=>{
  smokeSettings.to = e.target.value;
});
document.getElementById('smokeColorMode').addEventListener('change', e=>{
  smokeSettings.colorMode = e.target.value;
  document.getElementById('singleColorRow').style.display = e.target.value === 'single' ? 'flex' : 'none';
  document.getElementById('multiColorRow').style.display = e.target.value === 'multi' ? 'flex' : 'none';
});
document.getElementById('smokeColorSingle').addEventListener('input', e=>{
  smokeSettings.singleColor = e.target.value;
});
document.getElementById('mouseInteractBtn').addEventListener('click', ()=>{
  smokeSettings.mouseInteract = !smokeSettings.mouseInteract;
  updateDot(document.getElementById('mouseInteractDot'), smokeSettings.mouseInteract);
});

function renderColorList(){
  const list = document.getElementById('colorList');
  list.innerHTML = '';
  smokeSettings.colors.forEach((hex, idx)=>{
    const wrap = document.createElement('div');
    wrap.className = 'color-chip';
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = hex;
    inp.addEventListener('input', e=>{ smokeSettings.colors[idx] = e.target.value; });
    wrap.appendChild(inp);
    if(smokeSettings.colors.length > 1){
      const rm = document.createElement('span');
      rm.textContent = '\u00d7';
      rm.className = 'chip-remove';
      rm.addEventListener('click', ()=>{
        smokeSettings.colors.splice(idx,1);
        renderColorList();
      });
      wrap.appendChild(rm);
    }
    list.appendChild(wrap);
  });
}
document.getElementById('addColorBtn').addEventListener('click', ()=>{
  if(smokeSettings.colors.length >= 6) return;
  smokeSettings.colors.push('#ffffff');
  renderColorList();
});
renderColorList();

/* =========================================================
   NEON WAVE ENGINE
========================================================= */
const wCanvas = document.getElementById('waveCanvas');
const wCtx = wCanvas.getContext('2d');
let waveTime = 0;

function drawWave(){
  wCtx.clearRect(0,0,wCanvas.width,wCanvas.height);
  if(fx.wave){
    drawSingleWave(waveTime, 'rgba(0,240,255,0.55)', 18, 0.015, 40);
    drawSingleWave(waveTime*1.3, 'rgba(255,0,127,0.4)', 26, 0.02, 70);
    waveTime += 0.02;
  }
  requestAnimationFrame(drawWave);
}

function drawSingleWave(t, color, amp, freq, yOffset){
  wCtx.beginPath();
  wCtx.moveTo(0, wCanvas.height);
  for(let x=0; x<=wCanvas.width; x+=4){
    const y = wCanvas.height - yOffset + Math.sin(x*freq + t) * amp;
    wCtx.lineTo(x, y);
  }
  wCtx.lineTo(wCanvas.width, wCanvas.height);
  wCtx.closePath();
  wCtx.fillStyle = color;
  wCtx.shadowBlur = 20;
  wCtx.shadowColor = color;
  wCtx.fill();
}
resizeCanvases();
drawWave();

/* =========================================================
   FAB DRAG + CONTROL PANEL
========================================================= */
const fabContainer = document.getElementById('fabContainer');
const fabMain = document.getElementById('fabMain');
const controlPanel = document.getElementById('controlPanel');
const smokePanel = document.getElementById('smokePanel');
const parallaxPanel = document.getElementById('parallaxPanel');
const posPanel = document.getElementById('posPanel');

let isDragging = false;
let dragMoved = false;
let offsetX = 0, offsetY = 0;

/* keep the popup menus fully on-screen no matter where the FAB gets dragged to */
function updatePanelOrientation(){
  const rect = fabContainer.getBoundingClientRect();
  const flipUp = rect.top > window.innerHeight * 0.55;
  const flipLeft = rect.left > window.innerWidth * 0.55;
  [controlPanel, smokePanel, parallaxPanel, posPanel].forEach(p=>{
    p.classList.toggle('flip-up', flipUp);
    p.classList.toggle('flip-left', flipLeft);
  });
  positionSmokePanel();
  positionParallaxPanel();
  positionPosPanel();
}

/* parallax panel stacks the same way the smoke panel does */
function positionParallaxPanel(){
  const gap = 12, margin = 8;
  parallaxPanel.style.width = controlPanel.offsetWidth + 'px';
  const flipUp = controlPanel.classList.contains('flip-up');
  const fabRect = fabContainer.getBoundingClientRect();
  if(flipUp){
    parallaxPanel.style.top = 'auto';
    parallaxPanel.style.bottom = (70 + controlPanel.offsetHeight + gap) + 'px';
  } else {
    parallaxPanel.style.bottom = 'auto';
    parallaxPanel.style.top = (70 + controlPanel.offsetHeight + gap) + 'px';
  }
  parallaxPanel.style.maxHeight = '60vh';
  const panelHeight = parallaxPanel.offsetHeight;
  if(flipUp){
    const viewportTop = (fabRect.top - (70 + controlPanel.offsetHeight + gap)) - panelHeight;
    if(viewportTop < margin){
      parallaxPanel.style.maxHeight = Math.max(120, panelHeight - (margin - viewportTop)) + 'px';
    }
  } else {
    const viewportBottom = fabRect.top + (70 + controlPanel.offsetHeight + gap) + panelHeight;
    if(viewportBottom > window.innerHeight - margin){
      parallaxPanel.style.maxHeight = Math.max(120, panelHeight - (viewportBottom - (window.innerHeight - margin))) + 'px';
    }
  }
}

/* ---- Parallax Settings panel wiring ---- */
[1,2,3,4,5,6,7].forEach(n=>{
  const input = document.getElementById('parallaxSpeed'+n);
  input.value = parallaxSpeeds[n-1];
  input.addEventListener('input', e=>{
    const v = parseFloat(e.target.value);
    if(!isNaN(v)) parallaxSpeeds[n-1] = v;
  });
});
document.getElementById('parallaxSettingsBtn').addEventListener('click', ()=>{
  positionParallaxPanel();
  parallaxPanel.classList.toggle('open');
});

/* parallax panel stacks the same way the smoke panel does */
function positionPosPanel(){
  const gap = 12, margin = 8;
  posPanel.style.width = controlPanel.offsetWidth + 'px';
  const flipUp = controlPanel.classList.contains('flip-up');
  const fabRect = fabContainer.getBoundingClientRect();
  if(flipUp){
    posPanel.style.top = 'auto';
    posPanel.style.bottom = (70 + controlPanel.offsetHeight + gap) + 'px';
  } else {
    posPanel.style.bottom = 'auto';
    posPanel.style.top = (70 + controlPanel.offsetHeight + gap) + 'px';
  }
  posPanel.style.maxHeight = '60vh';
  const panelHeight = posPanel.offsetHeight;
  if(flipUp){
    const viewportTop = (fabRect.top - (70 + controlPanel.offsetHeight + gap)) - panelHeight;
    if(viewportTop < margin){
      posPanel.style.maxHeight = Math.max(120, panelHeight - (margin - viewportTop)) + 'px';
    }
  } else {
    const viewportBottom = fabRect.top + (70 + controlPanel.offsetHeight + gap) + panelHeight;
    if(viewportBottom > window.innerHeight - margin){
      posPanel.style.maxHeight = Math.max(120, panelHeight - (viewportBottom - (window.innerHeight - margin))) + 'px';
    }

}

/* ---- Character Position panel wiring ---- */
const charPositions = { 5:[18,94], 6:[54,97], 7:[84,100] }; // starting x%,y% for each character layer
[5,6,7].forEach(n=>{
  const xInput = document.getElementById('posX'+n);
  const yInput = document.getElementById('posY'+n);
  const layerEl = document.getElementById('layer'+n);
  xInput.value = charPositions[n][0];
  yInput.value = charPositions[n][1];
  function applyPos(){
    layerEl.style.backgroundPosition = xInput.value + '% ' + yInput.value + '%';
  }
  xInput.addEventListener('input', applyPos);
  yInput.addEventListener('input', applyPos);
});
document.getElementById('charPosBtn').addEventListener('click', ()=>{
  positionPosPanel();
  posPanel.classList.toggle('open');
});

/* smoke panel always stacks directly below (or above) the main panel, matching its
   width and horizontal side, so it can never spill off a narrow phone screen */
function positionSmokePanel(){
  const gap = 12, margin = 8;
  smokePanel.style.width = controlPanel.offsetWidth + 'px';
  const flipUp = controlPanel.classList.contains('flip-up');
  const fabRect = fabContainer.getBoundingClientRect(); // fabContainer itself has no transform, safe to read directly
  if(flipUp){
    smokePanel.style.top = 'auto';
    smokePanel.style.bottom = (70 + controlPanel.offsetHeight + gap) + 'px';
  } else {
    smokePanel.style.bottom = 'auto';
    smokePanel.style.top = (70 + controlPanel.offsetHeight + gap) + 'px';
  }
  smokePanel.style.maxHeight = '60vh';
  // offsetHeight ignores the open/close CSS transform (scale/translate), so this stays accurate
  // even mid-transition - getBoundingClientRect would under-measure while still animating in
  const panelHeight = smokePanel.offsetHeight;
  if(flipUp){
    const viewportTop = (fabRect.top - (70 + controlPanel.offsetHeight + gap)) - panelHeight;
    if(viewportTop < margin){
      smokePanel.style.maxHeight = Math.max(120, panelHeight - (margin - viewportTop)) + 'px';
    }
  } else {
    const viewportBottom = fabRect.top + (70 + controlPanel.offsetHeight + gap) + panelHeight;
    if(viewportBottom > window.innerHeight - margin){
      smokePanel.style.maxHeight = Math.max(120, panelHeight - (viewportBottom - (window.innerHeight - margin))) + 'px';
    }
  }
}

function dragStart(x, y){
  isDragging = true;
  dragMoved = false;
  const rect = fabContainer.getBoundingClientRect();
  offsetX = x - rect.left;
  offsetY = y - rect.top;
}

function dragMove(x, y){
  if(!isDragging) return;
  dragMoved = true;
  let nx = x - offsetX;
  let ny = y - offsetY;
  nx = Math.max(0, Math.min(window.innerWidth - 58, nx));
  ny = Math.max(0, Math.min(window.innerHeight - 58, ny));
  fabContainer.style.left = nx + 'px';
  fabContainer.style.top = ny + 'px';
  updatePanelOrientation();
}

function dragEnd(){
  isDragging = false;
}

/* mouse (desktop) */
fabMain.addEventListener('mousedown', (e)=> dragStart(e.clientX, e.clientY));
window.addEventListener('mousemove', (e)=> dragMove(e.clientX, e.clientY));
window.addEventListener('mouseup', dragEnd);

/* touch (phone/tablet) - full drag-anywhere-on-screen support */
fabMain.addEventListener('touchstart', (e)=>{
  const t = e.touches[0];
  dragStart(t.clientX, t.clientY);
}, {passive:true});
window.addEventListener('touchmove', (e)=>{
  if(!isDragging || !e.touches.length) return;
  e.preventDefault(); // stop the page from scrolling while dragging the FAB
  dragMove(e.touches[0].clientX, e.touches[0].clientY);
}, {passive:false});
window.addEventListener('touchend', dragEnd);
window.addEventListener('touchcancel', dragEnd);

fabMain.addEventListener('click', ()=>{
  if(dragMoved) return; // don't toggle panel after a drag
  updatePanelOrientation();
  controlPanel.classList.toggle('open');
});

/* Toggle buttons */
document.querySelectorAll('.ctrl-btn[data-fx]').forEach(btn=>{
  const key = btn.dataset.fx;
  const dot = btn.querySelector('.state-dot');
  updateDot(dot, fx[key]);
  btn.addEventListener('click', ()=>{
    fx[key] = !fx[key];
    updateDot(dot, fx[key]);
    if(key === 'glow' && !fx.glow) fgLayer.classList.remove('glow-on');
    if(key === 'wave') wCtx.clearRect(0,0,wCanvas.width,wCanvas.height);
    if(key === 'particles' && !fx.particles) particles = [];
    if(key === 'smoke' && !fx.smoke) sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
  });
});

function updateDot(dot, state){
  dot.classList.toggle('on', state);
}

/* ULTRA MIX ALL */
document.getElementById('ultraBtn').addEventListener('click', ()=>{
  Object.keys(fx).forEach(k=> fx[k] = true);
  document.querySelectorAll('.ctrl-btn[data-fx]').forEach(btn=>{
    updateDot(btn.querySelector('.state-dot'), true);
  });
  fabMain.classList.add('spin');
  setTimeout(()=>fabMain.classList.remove('spin'), 1500);
});
</script>
